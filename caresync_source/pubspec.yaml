name: care_sync
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  flutter_svg: ^2.2.3
  font_awesome_flutter: ^10.12.0
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  firebase_messaging: ^15.2.10
  fl_chart: ^0.66.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_map: 8.3.1
  latlong2: 0.9.1
  geolocator: ^13.0.1
  google_sign_in: ^6.2.1
  health: ^11.0.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  device_info_plus: ^10.1.2
  flutter_tts: ^4.2.2
  pdf: ^3.12.0
  printing: ^5.14.3
  intl: ^0.19.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - lib/assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/assets/logo.png"
